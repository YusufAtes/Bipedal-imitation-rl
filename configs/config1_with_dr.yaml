name: config1_with_dr
description: >-
  Configuration 1 with domain randomisation enabled (friction 0.6-1.4, foot
  mass +-20%, motor delay 0-20 ms, encoder noise 0.01 rad std). Used by the
  C5 robustness study.
env:
  observation: full
  reward: full
  rsi: true
  decay_schedule: none
  decay_alpha: 0.0
  dt: 0.001
  speed_limit: 2.2
  ramp_limit_deg: 5.0
  max_episode_seconds: 3.0
  include_pad_dims: false
  dr:
    enabled: true
    friction_range: [0.6, 1.4]
    foot_mass_scale_range: [0.8, 1.2]
    motor_delay_ms_range: [0.0, 20.0]
    encoder_noise_std: 0.01
  alive_weight: 0.5
  contact_weight: 0.6
  speed_weight: 0.6
  torque_weight: 0.001
  imitation_weight_hip_pos: 0.75
  imitation_weight_knee_pos: 0.75
  imitation_weight_ankle_pos: 0.25
  imitation_weight_hip_vel: 0.15
  imitation_weight_knee_vel: 0.15
  imitation_weight_ankle_vel: 0.1
policy:
  arch: mlp_256_256
  activation: relu
train:
  total_timesteps: 15000000
  n_steps: 8192
  batch_size: 256
  n_epochs: 5
  clip_range: 0.15
  target_kl: 0.2
  learning_rate: 0.0003
  learning_rate_final: 0.0001
  entropy_coef_start: 0.001
  entropy_coef_end: 0.0001
  save_freq: 500000
  seed: 42
